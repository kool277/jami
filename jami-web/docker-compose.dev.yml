version: '3.9'

services:
  jami-web:
    image: jami-web
    environment:
      NODE_ENV: development
      VITE_HOST: 0.0.0.0
    build:
      context: .
      target: development
    volumes:
      - ./client/src:/web-client/client/src
      - ./server/src:/web-client/server/src
      - ./server/locale:/web-client/server/locale
      - ./client/.env.development:/web-client/client/.env.development
      - ./server/openid-providers.json:/web-client/server/openid-providers.json
    ports:
      - '3000:3000'
      - '5002:5002'
    stdin_open: true
    depends_on:
      - jami-daemon

  jami-daemon:
    image: jami-daemon
    build:
      context: ./daemon
      args:
        cmake_args: '-DJAMI_NODEJS=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release'
