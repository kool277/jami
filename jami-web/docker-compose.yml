services:
  jami-web:
    image: jami-web
    environment:
      NODE_ENV: production
      JAMI_WEB_DATA_DIR: /data/jami-web
    build:
      context: .
      target: production
    volumes:
        - ${JAMI_WEB_DATA_DIR:-jami-web-data}:/data/jami-web
        - jami-data:/root/.local/share/jami
    ports:
      - '${JAMI_WEB_PORT:-8080}:8080'
    stdin_open: true

volumes:
  jami-web-data:
  jami-data: