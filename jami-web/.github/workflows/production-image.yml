name: Production Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  production-image:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build without Git metadata
        run: git archive --format=tar HEAD | docker build --target production --tag jami-web:without-git -
      - name: Build with an explicit source revision
        run: |
          docker build \
            --target production \
            --build-arg GIT_COMMIT_HASH=container-test-revision \
            --tag jami-web:with-revision \
            .
      - name: Verify the revision is bundled in client assets
        run: |
          docker run --rm --entrypoint sh jami-web:with-revision -c \
            'grep --recursive --quiet --binary-files=text container-test-revision /web-client/server/client/dist'
      - name: Start the production image
        run: |
          container_name=jami-web-production-test
          trap 'docker logs "$container_name"; docker rm --force "$container_name"' EXIT
          docker run \
            --detach \
            --name "$container_name" \
            --publish 127.0.0.1::8080 \
            --env JAMI_WEB_DATA_DIR=/tmp/jami-web-data \
            jami-web:with-revision
          port=$(docker port "$container_name" 8080/tcp | sed 's/.*://')
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            "http://127.0.0.1:$port/api/config/languages"
