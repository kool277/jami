<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="550" viewBox="0 0 860 550" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Main background gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d6e6a"/>
            <stop offset="50%" stop-color="#19908c"/>
            <stop offset="100%" stop-color="#1db8b3"/>
        </linearGradient>

        <!-- Bubble fill -->
        <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#b2f5f3" stop-opacity="0.10"/>
        </linearGradient>

        <!-- Glow filter for central group -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
            <feFlood flood-color="#28F4F9" flood-opacity="0.25" result="color"/>
            <feComposite in="color" in2="blur" operator="in" result="shadow"/>
            <feMerge>
                <feMergeNode in="shadow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Subtle noise texture overlay -->
        <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3"
                          stitchTiles="stitch" result="noiseOut"/>
            <feColorMatrix type="saturate" values="0" in="noiseOut" result="grey"/>
            <feBlend in="SourceGraphic" in2="grey" mode="overlay" result="blend"/>
            <feComposite in="blend" in2="SourceGraphic" operator="in"/>
        </filter>
    </defs>

    <!-- ── Background ── -->
    <rect width="860" height="550" fill="url(#bgGrad)"/>

    <!-- Subtle noise texture -->
    <rect width="860" height="550" fill="url(#bgGrad)" filter="url(#noise)" opacity="0.07"/>

    <!-- ── Decorative arcs (flow lines) ── -->
    <g stroke="#28F4F9" stroke-opacity="0.12" fill="none" stroke-width="1.5">
        <path d="M -40,300 Q 200,80  460,260 T 920,220"/>
        <path d="M -40,380 Q 200,160 460,340 T 920,300"/>
        <path d="M -40,460 Q 200,240 460,420 T 920,380"/>
        <path d="M -40,200 Q 200,0   460,180 T 920,140"/>
    </g>

    <!-- ── Floating script glyphs (decorative, background layer) ── -->
    <g font-weight="bold" fill="#28F4F9" fill-opacity="0.09" font-family="serif">
        <!-- top-left cluster -->
        <text x="38" y="95" font-size="64">A</text>
        <text x="110" y="52" font-size="40">α</text>
        <text x="28" y="160" font-size="36">文</text>
        <text x="80" y="200" font-size="48">あ</text>

        <!-- top-right cluster -->
        <text x="720" y="80" font-size="56">ع</text>
        <text x="790" y="50" font-size="38">한</text>
        <text x="760" y="140" font-size="44">Д</text>

        <!-- bottom-left cluster -->
        <text x="20" y="440" font-size="52">ह</text>
        <text x="80" y="490" font-size="36">ب</text>
        <text x="30" y="530" font-size="42">β</text>

        <!-- bottom-right cluster -->
        <text x="730" y="460" font-size="58">中</text>
        <text x="800" y="510" font-size="36">ก</text>
        <text x="760" y="400" font-size="44">ש</text>

        <!-- scattered mid -->
        <text x="160" y="490" font-size="38">Ü</text>
        <text x="680" y="200" font-size="34">ñ</text>
        <text x="580" y="490" font-size="42">æ</text>
        <text x="480" y="70" font-size="30">Ω</text>
    </g>

    <!-- ── Left speech bubble ── -->
    <path d="M 155,175
                   Q 155,148 178,148
                   L 340,148
                   Q 363,148 363,175
                   L 363,250
                   Q 363,277 340,277
                   L 230,277
                   L 210,305
                   L 215,277
                   L 178,277
                   Q 155,277 155,250
                   Z"
          fill="url(#bubbleGrad)"
          stroke="#28F4F9" stroke-opacity="0.30" stroke-width="1.5"
          filter="url(#glow)"/>

    <!-- ── Right speech bubble ── -->
    <path d="M 497,245
                  Q 497,218 520,218
                  L 682,218
                  Q 705,218 705,245
                  L 705,320
                  Q 705,347 682,347
                  L 650,347
                  L 655,375
                  L 635,347
                  L 520,347
                  Q 497,347 497,320
                  Z"
          fill="url(#bubbleGrad)"
          stroke="#28F4F9" stroke-opacity="0.30" stroke-width="1.5"
          filter="url(#glow)"/>

    <!-- ── Arrow between bubbles ── -->
    <g stroke="#28F4F9" stroke-opacity="0.55" fill="none" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
        <!-- curved path from right edge of left bubble to left edge of right bubble -->
        <path d="M 368,212 C 410,195 455,242 492,255"/>
        <!-- arrowhead -->
        <polyline points="480,243 492,255 480,267"/>
    </g>

    <!-- ── Large "A" in left bubble ── -->
    <text x="259" y="248"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="72" font-weight="bold"
          fill="#e8fffe" fill-opacity="0.90"
          text-anchor="middle" dominant-baseline="auto"
          filter="url(#glow)">A
    </text>

    <!-- ── "あ" in right bubble ── -->
    <text x="601" y="318"
          font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', sans-serif"
          font-size="64" font-weight="bold"
          fill="#e8fffe" fill-opacity="0.90"
          text-anchor="middle" dominant-baseline="auto"
          filter="url(#glow)">あ
    </text>

    <!-- ── Subtle vignette ── -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
        <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <rect width="860" height="550" fill="url(#vignette)"/>
</svg>