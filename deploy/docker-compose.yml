# Jami server side: JAMS behind Caddy (HTTPS), coturn (TURN), an OpenDHT
# node (DHT bootstrap + DHT proxy) and the Jami web client, whose users
# sign in with their JAMS account. Settings come from .env (copy
# .env.example). See docs/SERVER-SETUP.md.
#
# oom_score_adj -800: when the host runs out of memory, the kernel kills
# these services last; the CI build containers run with +800 (ci/*/run.sh)
# and go first.
name: jami

services:
  jams:
    build:
      context: ../jami-jams
      target: prod
    image: jams:local
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./jams/entrypoint.sh:/entrypoint.sh:ro
      - jams-data:/home/jams
    expose:
      - "8080"
    restart: unless-stopped
    oom_score_adj: -800
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      jams:
        condition: service_healthy
    environment:
      JAMS_HOST: ${JAMS_HOST:?set JAMS_HOST in .env}
      JAMS_TLS: ${JAMS_TLS:-internal}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-8443}
    ports:
      - "${JAMS_HTTPS_PORT:-443}:443"
      - "${WEB_HTTPS_PORT:-8443}:${WEB_HTTPS_PORT:-8443}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    oom_score_adj: -800
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.3
    # TURN relays use a port range; host networking avoids publishing
    # each port. The host's own coturn.service keeps 3478.
    network_mode: host
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      TURN_REALM: ${TURN_REALM:?set TURN_REALM in .env}
      TURN_USER: ${TURN_USER:?set TURN_USER in .env}
      TURN_PASSWORD: ${TURN_PASSWORD:?set TURN_PASSWORD in .env}
      TURN_PORT: ${TURN_PORT:-3479}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    volumes:
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
      - coturn-data:/var/lib/coturn
    restart: unless-stopped
    oom_score_adj: -800
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p ${TURN_PORT:-3479} 127.0.0.1 >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Jami web client. Its embedded daemon signs users in at
  # https://JAMS_HOST, so it has to trust Caddy's CA: certs/ca-bundle.crt
  # (scripts/export-ca.sh) is mounted as the system bundle. The daemon runs
  # in Node.js and verifies certificates with the OpenSSL of Node.js, which
  # looks for /etc/ssl/cert.pem (absent on Debian) and hashed files in
  # /etc/ssl/certs, not for the bundle: SSL_CERT_FILE points it there.
  # Node itself trusts Caddy's CA through NODE_EXTRA_CA_CERTS, which the
  # daemon ignores. The daemon keeps its accounts in ~/.config/jami
  # and their data in ~/.local/share/jami: both are volumes, so a user
  # keeps the same JAMS device across restarts. Plain HTTP on this host
  # only (127.0.0.1, a secure context for the browser); other machines
  # use Caddy's HTTPS on WEB_HTTPS_PORT. Configured by scripts/web-setup.sh.
  web:
    build:
      context: ../jami-web
      target: production
    image: jami-web:local
    environment:
      JAMI_WEB_DATA_DIR: /data/jami-web
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/jams-root.crt
    volumes:
      - web-data:/data/jami-web
      - web-daemon-config:/root/.config/jami
      - web-daemon-data:/root/.local/share/jami
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./certs/jams-root.crt:/etc/ssl/certs/jams-root.crt:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    restart: unless-stopped
    oom_score_adj: -800
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  dhtnode:
    build: ./dhtnode
    image: jami-dhtnode:local
    command:
      - dhtnode
      - -s
      - -p
      - "4222"
      - --proxyserver
      - "8000"
      - -b
      - ${DHT_BOOTSTRAP:-bootstrap.jami.net}
    ports:
      - "${DHT_PORT:-4222}:4222/udp"
      - "${DHT_PROXY_PORT:-8000}:8000"
    restart: unless-stopped
    oom_score_adj: -800
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/ | grep -q node_id"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jams-data:
  caddy-data:
  caddy-config:
  coturn-data:
  web-data:
  web-daemon-config:
  web-daemon-data:
